name: siraaj
description: Siraaj - Your Daily Islamic Companion
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  dio: ^5.4.0
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.1
  audioplayers: ^6.8.1
  flutter_animate: ^4.5.0
  google_fonts: ^6.1.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.9
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  geolocator: ^11.0.0
  sensors_plus: ^5.0.1
  permission_handler: ^11.0.0
  adhan: ^2.0.0+1
  timezone: ^0.9.2
  cupertino_icons: ^1.0.6
  url_launcher: ^6.3.2
  syncfusion_flutter_pdfviewer: ^34.2.5
  hijri: ^3.0.1
  record: ^7.1.1
  speech_to_text: ^7.4.0
  diff_match_patch: ^0.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/data/
    - assets/quran/
    - assets/hadith/
    - assets/azkar/
    - assets/fonts/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
