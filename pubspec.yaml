name: siraaj
description: Siraaj - Your Daily Islamic Companion
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Routing
  go_router: ^13.0.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI & Animations
  flutter_animate: ^4.5.0
  lottie: ^3.0.0
  shimmer: ^3.0.0
  
  # Icons
  flutter_svg: ^2.0.9
  
  # Audio
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  
  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  
  # Location & Qibla
  geolocator: ^11.0.0
  sensors_plus: ^5.0.1
  
  # PDF Export
  pdf: ^3.10.7
  printing: ^5.11.1
  
  # Charts
  fl_chart: ^0.66.2
  
  # Internationalization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  
  # Network
  dio: ^5.4.0
  
  # Utilities
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/data/